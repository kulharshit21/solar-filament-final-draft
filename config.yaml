# Clean MAGFiLO pipeline configuration (4 x A100-40GB layout).
# Every value here is a starting point; final post-processing is chosen on the held-out fold.

paths:
  work: work                 # all generated data, models and predictions
  submissions: submissions   # final CSV + validation report

data:
  n_splits: 5
  group_chars: 8             # GroupKFold groups = YYYYMMDD prefix of the image stem
  fold_index: 0              # fold held out for OOF validation and policy selection
  preprocess: clahe          # clahe | raw  (applied identically to train and test)
  clahe_clip: 2.0
  clahe_tile: 8
  limit_train_stems: 0       # 0 = all (smoke tests only)
  limit_val_stems: 0
  limit_test_images: 0
  workers: 16                # CPU processes for preprocessing / selection

yolo:
  init_fold: models/yolo11x-seg.pt   # generic COCO weights -> honest OOF on the held-out fold
  init_full: models/yolo11x-seg.pt   # set to models/yolo11x_v75_best.pt to fine-tune v75 (see README)
  test_use_full: true                # test predictions from the all-data model when it exists
  imgsz: 1600
  epochs: 50
  batch: 4                   # measured ~7.5 GB per 1600 image -> ~31 GB on one A100-40GB (use 3 on OOM);
                             # ultralytics accumulates gradients to nominal batch 64
  workers: 8
  cache: ram                 # ram | disk | false
  optimizer: AdamW
  lr0: 0.001                 # use ~3e-5 when init_full is the already fine-tuned v75 checkpoint
  lrf: 0.01
  weight_decay: 0.0001
  warmup_epochs: 2
  cos_lr: true
  patience: 100
  time_hours: 3.0            # ultralytics 'time': train for this many hours (overrides epochs, keeps the
                             # cosine schedule consistent). 0 = use epochs.
  mosaic: 0.5
  copy_paste: 0.3
  mixup: 0.0
  fliplr: 0.5
  flipud: 0.5
  degrees: 15.0
  translate: 0.1
  scale: 0.2
  hsv_h: 0.01
  hsv_s: 0.10
  hsv_v: 0.25
  close_mosaic: 10
  overlap_mask: false
  mask_ratio: 4
  # inference
  infer_imgsz: 1600
  infer_conf: 0.05           # low floor; the final score threshold is chosen on OOF
  infer_iou: 0.6
  max_det: 300
  tta_flips: [none, h, v]

mask2former:
  enabled: true
  pretrained: models/hf/mask2former-swin-large-coco-instance
  image_size: 1280
  batch_size: 1              # measured ~18 GB peak per 1280 image (bf16) -> batch 1 on A100-40GB
  grad_accum: 8              # effective batch 8
  epochs: 30
  time_hours: 3.5            # wall-clock budget; LR cosine follows the budget, best checkpoint is kept
  max_steps: 0               # 0 = no cap (smoke tests only)
  lr_decoder: 0.0001
  lr_backbone: 0.00001
  weight_decay: 0.05
  warmup_steps: 500
  grad_clip: 0.01            # Mask2Former reference recipe (full-model gradient clipping)
  rotate_degrees: 15.0
  num_workers: 8
  eval_every: 3              # epochs between held-out PQ evaluations
  # inference
  min_class_prob: 0.05
  topk: 60
  tta_flips: [none, h]

sam2:
  enabled: true
  pretrained: models/hf/sam2.1-hiera-large
  epochs: 8
  time_hours: 3.0            # wall-clock budget
  max_steps: 0
  batch_size: 8              # measured ~4 GB peak (frozen encoder)
  lr: 0.00005
  weight_decay: 0.01
  num_workers: 8
  context_train: [1.3, 2.0]  # random crop side / box side during training
  context_infer: 1.6
  min_crop: 256
  box_jitter: 0.1
  val_max_annotations: 1500
  infer_batch: 16
  refine_sources: [yolo, mask2former]

select:
  mask_thresholds: [0.3, 0.4, 0.5, 0.6]
  min_areas: [0, 100, p05]   # p05 = 5th percentile of training GT area (training data only)
  max_area_factor: 2.0       # reject masks larger than 2 x the largest training-fold GT filament
  score_grid: [0.05, 0.95, 0.01]
  smooth: 2                  # +/- grid steps for plateau (not spike) selection
  fuse_iou: 0.5
  fuse_weights: [[1, 1], [2, 1], [1, 2]]
  try_crf: true              # only if pydensecrf imports; kept only if it raises OOF PQ
  crf_iters: 5
  crf_sxy: 80
  crf_srgb: 13

submission:
  name: submission_v76_clean_ensemble.csv
  allow_partial: false       # smoke tests only
